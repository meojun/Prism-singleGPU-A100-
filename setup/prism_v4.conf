[program:prism_v4]
environment=PROC_NAME="%(program_name)s",CUDA_VISIBLE_DEVICES="0,1"
command=/workspace/prism-exp/exp/scripts/watchdog_v4.sh
directory=/workspace/prism-exp
autostart=false
autorestart=unexpected
startsecs=10
stopwaitsecs=90
# Stop the whole process group. Without these, supervisorctl stop kills
# only the watchdog and leaves the pipeline it started running -- still
# holding the watchdog's flock, so the next start exits immediately and
# supervisor gives up with FATAL.
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
