[program:prism_pipeline]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/prism_pipeline.sh
directory=/workspace/prism-exp
autostart=true
autorestart=unexpected
startsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/supervisor_pipeline.log
redirect_stderr=true
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
