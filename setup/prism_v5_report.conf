[program:prism_v5_report]
environment=PROC_NAME="%(program_name)s",CUDA_VISIBLE_DEVICES="0,1"
command=/workspace/prism-exp/exp/scripts/report_v5.sh
directory=/workspace/prism-exp
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
